appId: com.lemao81.steadychime
---
- clearState
- setPermissions:
    permissions:
      notifications: ${NOTIFICATIONS || "allow"}
- openLink: steadychime://expo-development-client/?url=${METRO_URL || "http%3A%2F%2Flocalhost%3A8081"}&disableAutoLaunch=1&disableFab=1
- extendedWaitUntil:
    visible:
      id: toggle-activity
    timeout: 120000
